plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}

version = project.mod_version + "+" + project.minecraft_version.tokenize(".").take(2).join(".")
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    mods {
        "beezzmap" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // the site keeps screenshots as WebP, which neither Java nor the game reads: TwelveMonkeys' pure Java decoder, inside the jar
    for (String lib : ["com.twelvemonkeys.imageio:imageio-webp:3.12.0", "com.twelvemonkeys.imageio:imageio-core:3.12.0",
                       "com.twelvemonkeys.imageio:imageio-metadata:3.12.0", "com.twelvemonkeys.common:common-lang:3.12.0",
                       "com.twelvemonkeys.common:common-io:3.12.0", "com.twelvemonkeys.common:common-image:3.12.0"]) {
        implementation lib
        include lib
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") { expand "version": project.version, "minecraft_version": project.minecraft_version.tokenize(".").take(2).join(".") }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

// ./gradlew runClientGameTest opens the screen in a real client, clicks through it and saves screenshots
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "beezzmap-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// ./gradlew runClientGameTest -PextraMods=<folder>: the same test with a player's own mods loaded next to this one
if (project.hasProperty("extraMods")) {
    // (only the BeezzLand test then: the other one clicks by fixed coordinates, which other mods' buttons can move)
    tasks.named("runClientGameTest") { jvmArgs "-Dfabric.addMods=" + file(project.property("extraMods")).absolutePath, "-Dbeezzmap.onlySite=true" }
}
